<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Password Checker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { padding: 6px; width: 250px; }
    button { padding: 6px 12px; cursor: pointer; }
    ul { padding-left: 20px; }
    .ok { color: green; }
    .not-ok { color: red; }
    .weak { color: red; font-weight: bold; }
    .medium { color: orange; font-weight: bold; }
    .strong { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Q1) Password Validity and Strength</h2>
  <p>Reg No: RA2311003011556</p>

  <input type="password" id="password" placeholder="Enter password">
  <button id="checkBtn">Check Validity</button>

  <p>Strength: <span id="strength">-</span></p>
  <p>Validity: <span id="validity">-</span></p>

  <ul id="rules"></ul>

  <script>
    // The 5 criteria a valid password must satisfy
    const rules = [
      { text: "At least one lowercase letter", test: p => /[a-z]/.test(p) },
      { text: "At least one uppercase letter", test: p => /[A-Z]/.test(p) },
      { text: "At least one number", test: p => /[0-9]/.test(p) },
      { text: "At least one special character", test: p => /[^a-zA-Z0-9]/.test(p) },
      { text: "Minimum 8 characters", test: p => p.length >= 8 }
    ];

    function countPassedRules(password) {
      let count = 0;
      for (let i = 0; i < rules.length; i++) {
        if (rules[i].test(password)) {
          count++;
        }
      }
      return count;
    }

    // all criteria = strong, at least half = medium, less than half = weak
    function getStrength(passed) {
      if (passed === rules.length) {
        return "Strong";
      } else if (passed >= rules.length / 2) {
        return "Medium";
      } else {
        return "Weak";
      }
    }

    function showRules(password) {
      const list = document.getElementById("rules");
      list.innerHTML = "";
      for (let i = 0; i < rules.length; i++) {
        const li = document.createElement("li");
        const passed = rules[i].test(password);
        li.textContent = (passed ? "✔ " : "✘ ") + rules[i].text;
        li.className = passed ? "ok" : "not-ok";
        list.appendChild(li);
      }
    }

    // Strength label updates while typing
    function updateStrength() {
      const password = document.getElementById("password").value;
      const label = document.getElementById("strength");

      if (password === "") {
        label.textContent = "-";
        label.className = "";
      } else {
        const strength = getStrength(countPassedRules(password));
        label.textContent = strength;
        label.className = strength.toLowerCase();
      }
      showRules(password);
    }

    // Validity is shown when the button is clicked
    function checkValidity() {
      const password = document.getElementById("password").value;
      const label = document.getElementById("validity");

      if (countPassedRules(password) === rules.length) {
        label.textContent = "Valid password";
        label.className = "ok";
      } else {
        label.textContent = "Invalid password - see the rules below";
        label.className = "not-ok";
      }
      updateStrength();
    }

    document.getElementById("password").addEventListener("input", updateStrength);
    document.getElementById("checkBtn").addEventListener("click", checkValidity);
    showRules("");
  </script>
</body>
</html>
